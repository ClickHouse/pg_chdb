name: ✅ CI
on:
  push:
    branches: [main, wip/**]
  pull_request:
  schedule:
    - cron: "0 12 10 * *" # Monthly at noon on the tenth
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pg: [19, 18, 17, 16]
        arch: [amd64, arm64]
    name: 🐘 PostgreSQL ${{ matrix.pg }} ${{ matrix.arch == 'amd64' && '🧰' || '🦾' }} ${{ matrix.arch }}
    runs-on: ubuntu-${{ matrix.arch == 'amd64' && 'latest' || '24.04-arm' }}
    env: { chdb_version: v26.5.1-rc.2 }
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
      - name: Start Postgres ${{ matrix.pg }}
        uses: ./.github/actions/setup-pg
        with: { version: "${{ matrix.pg }}", packages: libkrb5-dev }
      - name: Cache chDB
        id: cache-chdb
        uses: actions/cache@v6
        with:
          key: chdb-${{ env.chdb_version }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            /usr/local/lib/libchdb.so
            /usr/local/include/chdb.*
      - name: Install chDB
        run: ${{ steps.cache-chdb.outputs.cache-hit != 'true' && 'curl -sL https://lib.chdb.io | bash' || 'ldconfig' }}
        env: { INSTALL_VERSION: "${{ env.chdb_version }}" }
      - run: |
          ls -lah /usr/local/lib/libchdb.so /usr/local/include/chdb.*
          md5sum /usr/local/lib/libchdb.so /usr/local/include/chdb.h
      - name: Build
        run: make -j $(nproc)
      - name: Install
        run: sudo make install PG_CONFIG=$(command -v pg_config)
      - name: Test
        run: make installcheck
      - name: Show Diffs
        if: failure()
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diffs-pg${{ matrix.pg }}
          path: regression.diffs
