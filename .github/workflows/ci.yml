name: ✅ CI
on:
  push:
    branches: [main, wip/**]
  pull_request:
  schedule:
    - cron: "0 12 10 * *" # Monthly at noon on the tenth
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pg: [19, 18, 17, 16, 15]
        os: [🐧, 🍎]
        arch: [amd64, arm64]
        build: [dynamic, static]
        libchdb: [v26.7.0, v26.7.3]
        exclude:
          - { os: 🍎 } # chdb: chDB was terminated by signal 6 (plus kv-rest Docker verboten)
          - { os: 🍎, arch: amd64 } # Unsupported by Homebrew
          - { os: 🍎, pg: 19 } # Not released yet
    name: ${{ matrix.os }} ${{ matrix.arch }} 🐘 ${{ matrix.pg }} 🏠 ${{ matrix.libchdb }} ${{ matrix.build }}
    runs-on: ${{ matrix.os == '🍎' && 'macos' || 'ubuntu' }}-${{ (matrix.os == '🐧' && matrix.arch == 'arm64') && '24.04-arm' || 'latest' }}
    env: { BUNDLE_LIBCHDB: 1, LIBCHDB_BUILD: "${{ matrix.build }}" }
    services:
      kv-rest:
        image: ghcr.io/theory/kv-rest
        ports: [80]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start Postgres ${{ matrix.pg }}
        uses: pgxn/postgres-action@v0
        with:
          version: ${{ matrix.pg }}
          packages: ${{ matrix.os == '🐧' && 'libkrb5-dev libipc-run-perl' || 'krb5 cpanminus' }}
      - name: Install IPC::Run on macOS
        if: matrix.os == '🍎'
        run: cpanm --notest IPC::Run
      # make BUNDLE_LIBCHDB=1 installs libchdb if missing.
      - name: Get chDB Version
        id: chdb
        run: make LIBCHDB_VERSION=${{ matrix.libchdb }} libchdb-variables >> $GITHUB_OUTPUT
      - name: Cache chDB
        id: cache-chdb
        uses: actions/cache@v6
        with:
          key: ${{ steps.chdb.outputs.directory }}-${{ matrix.build }}
          path: |
            ${{ steps.chdb.outputs.directory }}/lib/libchdb.*
            ${{ steps.chdb.outputs.directory }}/include/chdb.h
      # chdb_helper can be shared across PG versions
      - name: Cache chDB Helper
        if: matrix.build == 'static'
        id: cache-helper
        uses: actions/cache@v6
        with:
          key: helper-${{ runner.os }}-${{ matrix.arch }}-${{ steps.chdb.outputs.version }}-${{ hashFiles('src/helper/*.c', 'src/setup.h') }}
          path: |
            src/helper/chdb_helper
            src/helper/chdb_helper.o
      - name: Freshen chDB Helper
        if: steps.cache-helper.outputs.cache-hit == 'true'
        run: touch src/helper/chdb_helper*
      - name: Build
        run: make -j $(nproc)
      - name: Install
        run: sudo --preserve-env=BUNDLE_LIBCHDB,LIBCHDB_BUILD make install
      - name: Configure AWS credentials # for s3.sql round-trip test
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          role-session-name: ${{ github.run_id }}
          aws-region: us-east-2
      - name: Test
        id: test
        run: make installcheck
        # https://console.cloud.google.com/storage/settings;tab=interoperability?project=ch-pg-test
        env:
          CLOUDSDK_AUTH_HMAC_KEY: ${{ secrets.gcp_hmac_key }}
          CLOUDSDK_AUTH_HMAC_SECRET: ${{ secrets.gcp_hmac_secret }}
          PG_CHDB_HTTP_URL: http://localhost:${{ job.services.kv-rest.ports[80] }}
      - name: Show Diffs
        if: failure() && steps.test.outcome == 'failure'
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ runner.os }}-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: |
            test/pgxs/regression.diffs
            test/pgxs/results
      - name: Test No File
        # NO_FILE_SCHEME disables file://; when set, file test should fail
        # with output that includes "could not open file". This step fails if
        # the test output does not include that text.
        run: |
          (cd src/hook && rm -rf chdb_hook.* hook.o)
          make -j $(nproc) NO_FILE_SCHEME=1
          sudo --preserve-env=BUNDLE_LIBCHDB,LIBCHDB_BUILD make install
          make installcheck TAP_TESTS= TESTS=test/sql/file.sql || true
          grep -s 'could not open file' regression.diffs
