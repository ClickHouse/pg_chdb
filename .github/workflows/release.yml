name: 🚀 Release
permissions:
  contents: write
on:
  push:
    branches: [main, wip/**]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
jobs:
  release:
    name: Release on GitHub and PGXN
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    env: { pg: 19, BUNDLE_LIBCHDB: 1 }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start Postgres
        run: pg-start ${{ env.pg }} libkrb5-dev
      # make BUNDLE_LIBCHDB=1 installs libchdb if missing.
      - name: Get chDB Version
        id: chdb
        run: make libchdb-variables >> $GITHUB_OUTPUT
      - name: Cache chDB
        id: cache-chdb
        uses: actions/cache@v6
        with:
          key: ${{ steps.chdb.outputs.directory }}
          path: |
            ${{ steps.chdb.outputs.directory }}/lib/libchdb.*
            ${{ steps.chdb.outputs.directory }}/include/chdb.h
      - name: Bundle the Release
        id: bundle
        run: pgxn-bundle
      - name: Test the Bundle
        env: { TAP_TESTS: "" }
        run: make dist-test
      - name: Release on PGXN
        if: startsWith( github.ref, 'refs/tags/v' )
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: pgxn-release
      - name: Generate Release Notes
        id: notes
        uses: theory/changelog-version-notes-action@v0
        if: startsWith( github.ref, 'refs/tags/v' )
      - name: Create GitHub Release
        if: startsWith( github.ref, 'refs/tags/v' )
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: "${{ steps.notes.outputs.file }}"
          files: ${{ steps.bundle.outputs.bundle }}
